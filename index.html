/* 极简双栏 */
:root{--bg:#fff;--ink:#252b27;--muted:#929992;--line:#edf0ec;--orange:#d88562;--green:#789486}
body{background:#fff;color:var(--ink)}
.sidebar{position:static;width:auto;height:64px;padding:0 32px;border:0;border-bottom:1px solid var(--line);display:flex;flex-direction:row;align-items:center;gap:24px}
.brand{font-size:18px;gap:8px;white-space:nowrap}.brandmark{width:28px;height:28px;line-height:25px;font-size:23px;border-radius:7px}.brand-en,.space-label,.nav,.section-label,.sidebar-bottom{display:none}

main{margin:0;max-width:none;padding:0 32px}header,.heading,.stats,footer{display:none}
.workspace{margin:0;border:0;border-radius:0;box-shadow:none}.workspace-bar{height:76px;padding:0;border-bottom:1px solid var(--line)}.workspace-bar>div{gap:8px}.workspace-bar h2{font-size:18px;max-width:none}.project-symbol,.tag{display:none}.tools button{font-size:12px;border-color:transparent;padding:8px 10px;color:#858e86}.tools button:hover{background:#f5f7f4}.viewbar{height:48px;padding:0;border:0}.legend{font-size:10px}.tabs button{font-size:12px}.workbody{min-height:calc(100vh - 190px);border-top:1px solid var(--line)}.canvas-column{width:60%;}.canvas-head{height:55px;padding:0 24px 0 0}.canvas-head button{font-size:11px}.canvas-scroll{max-height:none;min-height:450px;background:radial-gradient(circle,#dce2db88 .7px,transparent .8px);background-size:20px 20px}.canvas-footer{padding:0 16px 0 0}.detail{width:38%;max-width:480px;min-width:320px;padding:32px 34px;background:#fff}.detail h3{font-size:22px;margin:15px 0}.detail-description{margin:18px 0 28px}.detail-section-title{font-size:13px;margin:28px 0 14px}.task-text,.note{font-size:12px}.task{padding:13px 0}.empty{background:#fafbf9;border:0;text-align:left;padding:15px}.detail-actions{margin-top:28px}.node-name{font-size:12px}.canvas-footer{color:#a6aea7}

function dueTargets(p){

 const result=[];

  const stage=target.stage;
  if(stage.dueDate&&deadlineInfo(stage.dueDate))result.push({...target,title:stage.title,date:stage.dueDate,taskId:null});
