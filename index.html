/* 极简双栏 */
:root{--bg:#fff;--ink:#252b27;--muted:#929992;--line:#edf0ec;--orange:#d88562;--green:#789486}
body{background:#fff;color:var(--ink)}
.sidebar{position:static;width:auto;height:64px;padding:0 32px;border:0;border-bottom:1px solid var(--line);display:flex;flex-direction:row;align-items:center;gap:24px}
.brand{font-size:18px;gap:8px;white-space:nowrap}.brandmark{width:28px;height:28px;line-height:25px;font-size:23px;border-radius:7px}.brand-en,.space-label,.nav,.section-label,.sidebar-bottom{display:none}

main{margin:0;max-width:none;padding:0 32px}header,.heading,.stats,footer{display:none}
.workspace{margin:0;border:0;border-radius:0;box-shadow:none}.workspace-bar{height:76px;padding:0;border-bottom:1px solid var(--line)}.workspace-bar>div{gap:8px}.workspace-bar h2{font-size:18px;max-width:none}.project-symbol,.tag{display:none}.tools button{font-size:12px;border-color:transparent;padding:8px 10px;color:#858e86}.tools button:hover{background:#f5f7f4}.viewbar{height:48px;padding:0;border:0}.legend{font-size:10px}.tabs button{font-size:12px}.workbody{min-height:calc(100vh - 190px);border-top:1px solid var(--line)}.canvas-column{width:60%;}.canvas-head{height:55px;padding:0 24px 0 0}.canvas-head button{font-size:11px}.canvas-scroll{max-height:none;min-height:450px;background:radial-gradient(circle,#dce2db88 .7px,transparent .8px);background-size:20px 20px}.canvas-footer{padding:0 16px 0 0}.detail{width:38%;max-width:480px;min-width:320px;padding:32px 34px;background:#fff}.detail h3{font-size:22px;margin:15px 0}.detail-description{margin:18px 0 28px}.detail-section-title{font-size:13px;margin:28px 0 14px}.task-text,.note{font-size:12px}.task{padding:13px 0}.empty{background:#fafbf9;border:0;text-align:left;padding:15px}.detail-actions{margin-top:28px}.node-name{font-size:12px}.canvas-footer{color:#a6aea7}

const $=s=>document.querySelector(s), uid=()=>globalThis.crypto?.randomUUID?.() || 'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='flowline.workspace.v1';
function blankProject(name='我的第一个项目',count=0){return {id:uid(),name,description:'通用流程框架 · 节点名称、事项和注意事项均可自由编辑',example:true,stages:Array.from({length:count},(_,i)=>({id:uid(),title:`阶段 ${String(i+1).padStart(2,'0')}`,status:i===0?'active':'pending',tasks:[],notes:[]}))}}
let state;try{state=JSON.parse(localStorage.getItem(KEY));if(!state||!Array.isArray(state.projects)||!state.projects.length)throw Error()}catch{const p=blankProject('未命名项目',0);state={projects:[p],current:p.id}}
state.projects.forEach(p=>{if(p.flows?.length){let f=p.flows.find(x=>x.id===p.activeFlow)||p.flows[0];p.activeFlow=f.id;p.stages=f.stages}});let inlineTaskId=null;let selected=null,view='route',zoom=1,toastTimer;

function toast(s){$('#toast').textContent=s;$('#toast').classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('visible'),2800)}

function syncTemplateLinks(){const templates=state.projects.filter(isTemplate);for(const t of templates){t.stages.forEach(s=>{s.status='pending';s.tasks.forEach(t=>t.done=false)});if(t.drawingData?.items)t.drawingData.items.forEach(i=>i.done=false)}for(const p of state.projects.filter(x=>!isTemplate(x))){for(const f of p.flows||[]){const t=templates.find(t=>(t.id===f.templateId||t.templateKey===f.templateId))||templates.find(t=>!f.templateId&&t.name===f.name);if(!t)continue;f.templateId=t.id;const previous=f.stages||[],used=new Set(),base=f.templateBase||{};f.stages=t.stages.map((source,index)=>{let old=previous.find(s=>s.sourceId===source.id||s.id===source.id)||previous.find(s=>!s.sourceId&&!used.has(s.id)&&s.title===source.title);if(!old&&!previous.some(s=>s.sourceId)&&previous.length===t.stages.length)old=previous[index];if(old)used.add(old.id);const prior=base[source.id];const remark=old&&old.remark&&(prior===undefined||old.remark!==prior)?old.remark:source.remark||'';return {...JSON.parse(JSON.stringify(source)),id:old?.id||uid(),sourceId:source.id,status:old?.status||'pending',remark,tasks:source.tasks.map(task=>{const priorTask=old?.tasks.find(x=>x.sourceId===task.id||x.id===task.id)||old?.tasks.find(x=>!x.sourceId&&x.text===task.text);return {...JSON.parse(JSON.stringify(task)),id:priorTask?.id||uid(),sourceId:task.id,done:priorTask?.done||false}})}});f.templateBase=Object.fromEntries(t.stages.map(s=>[s.id,s.remark||'']));f.name=t.name;f.categories=[...(t.categories||[])];f.viewMode=t.viewMode||'cards';if(f.drawingData){f.drawingData.items=f.stages.map(s=>({id:s.id,title:s.title,category:s.category||'未分类',done:s.status==='done',notes:s.remark||'',keys:t.drawingData?.items?.find(it=>it.id===s.sourceId)?.keys||''}))}if(p.activeFlow===f.id)p.stages=f.stages}if(p.flows?.length)p.sourceTemplateName=p.flows.map(f=>f.name).join('、')}}

function stats(){const stages=project().stages;const done=stages.filter(s=>s.status==='done').length;const pending=stages.reduce((n,s)=>n+s.tasks.filter(t=>!t.done).length,0);const notes=stages.reduce((n,s)=>n+s.notes.length,0);$('#stats').innerHTML=[['整体进度',stages.length?Math.round(done/stages.length*100):0,'%', '◴'],['流程节点',stages.length,'个','⌁'],['待办事项',pending,'项','☷'],['注意事项',notes,'条','⚑']].map(([l,n,u,i])=>`<div class="stat"><div><div class="stat-label">${l}</div><div class="stat-value">${n}<small>${u}</small></div></div><div class="stat-icon">${i}</div></div>`).join('')}
