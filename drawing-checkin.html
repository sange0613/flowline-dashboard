function appendNoteSection(parent,label,value,className){if(!value.trim())return;const section=document.createElement('section');section.className='note-section';const heading=document.createElement('div');heading.className='note-label';heading.textContent=label;const lines=document.createElement('ul');lines.className='note-lines '+className;value.split(/\r?\n/).forEach(line=>{const row=document.createElement('li');row.textContent=line||'\u00a0';lines.append(row)});section.append(heading,lines);parent.append(section)}

a-pressed',String(it.done));b.setAttribute('aria-label',it.title+(it.done?'，已完成，点击撤销':'，点击标记完成'));status.textContent=it.done?'已完成':'待完成';save(false);if(filter!=='all')render();if(it.done)toast('✓ '+it.title+'，完成！')};const foot=document.createElement('div');foot.className='cardfoot';mountNoteTable(foot,it);const addNote=document.createElement('button');addNote.type='button';addNote.className='add-note-icon';addNote.textContent='＋';addNote.setAttribute('aria-label','编辑'+it.title+'的备注');addNote.onclick=()=>openEditor(it.id);card.append(b,foot,addNote);card.onclick=e=>{if(e.target.closest('button,input,select,textarea,a,.note-section')||window.getSelection()?.toString())return;b.click()};lanes.get(it.category).append(card)});lanes.forEach((cards,category)=>{if(cards.children.length)return;const empty=document.createElement('div');empty.className='lane-empty';empty.textContent=query?'没有匹配的图纸':filter==='done'?'还没有已完成图纸':filter==='todo'?'没有待完成图纸':'暂无图纸 · 可在编辑中调整所属类别';cards.append(empty)})}

function openEditor(id){$('category').replaceChildren(...categorySelect(categories[0],'所属类别').children);$('customCategory').value='';editing=id;const it=items.find(x=>x.id===id);$('title').value=it?.title||'';$('keys').value=it?.keys||'';$('notes').value=it?.notes||'';renderNoteEditor(it?.notes||'');$('category').value=it?.category||'平面图纸';$('dialogTitle').textContent=it?'图纸笔记':'添加一张图纸';$('orderControls').hidden=!it;$('editor').showModal()}
$('editform').onsubmit=e=>{e.preventDefault();const title=$('title').value.trim();if(!title)return;let it=items.find(x=>x.id===editing);if(!it){it={id:crypto.randomUUID?crypto.randomUUID():'drawing-'+Date.now(),done:false};items.push(it)}const chosenCategory=$('customCategory').value.trim()||$('category').value||'未分类';if(!categories.includes(chosenCategory))categories.push(chosenCategory);Object.assign(it,{title,category:chosenCategory,keys:$('keys').value,notes:$('notes').value});save();$('editor').close();toast('笔记已保存')};$('cancel').onclick=()=>$('editor').close();$('add').onclick=()=>openEditor(null);$('delete').onclick=()=>{if(confirm('删除这张图纸及其笔记？此操作不可撤销。')){items=items.filter(x=>x.id!==editing);save();$('editor').close()}};document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render()});$('search').oninput=render;
$('export').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,items,pageNotes},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='施工图打卡备份-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('备份已导出')};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>5000000)throw Error();const data=JSON.parse(await f.text());if(data.version!==1||!valid(data.items)||(data.pageNotes!==undefined&&!validPageNotes(data.pageNotes)))throw Error();if(confirm('导入将替换当前清单和进度，建议先导出备份。继续？')){items=normalizeItems(data.items);if(templateMode)items.forEach(it=>it.done=false);if(data.pageNotes!==undefined){pageNotes=normalizePageNotes(data.pageNotes);savePageNotes();renderPageNotes()}save();toast('备份已恢复')}}catch(err){toast('备份格式不正确，未更改当前记录')}e.target.value=''};render();renderPageNotes();

function sendDrawingState(){parent.postMessage({type:'flowline-drawing-state',scope:drawingScope,items,pageNotes},'*')}
window.addEventListener('message',e=>{if(e.source!==parent||e.data?.type!=='flowline-drawing-init')return;const d=e.data.data;if(d&&valid(d.items)){items=normalizeItems(d.items);if(templateMode)items.forEach(it=>it.done=false);if(d.pageNotes&&validPageNotes(d.pageNotes))pageNotes=normalizePageNotes(d.pageNotes);save();savePageNotes();render();renderPageNotes()}sendDrawingState()});
parent.postMessage({type:'flowline-drawing-ready',scope:drawingScope},'*');
</script></body></html>
